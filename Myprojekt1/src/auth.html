<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід продавця — Ринок Онлайн</title>

    <link rel="stylesheet" href="css/base.css?v=20260622-2">
    <link rel="stylesheet" href="css/home.css?v=20260622-2">
    <link rel="stylesheet" href="css/components.css?v=20260731-1">
    <link rel="stylesheet" href="css/seller.css?v=20260622-2">
    <link rel="stylesheet" href="css/glass-theme.css?v=20260622-2">
    <link rel="stylesheet" href="css/internal-pages.css?v=20260628-1">
    <link rel="stylesheet" href="css/overrides.css?v=20260801-1">
    <link rel="stylesheet" href="css/theme-background.css?v=20260729-1">
    <link rel="stylesheet" href="css/auth.css?v=20260709-2">
    <link rel="stylesheet" href="css/responsive-mobile.css?v=20260709-1">
    <link rel="stylesheet" href="css/responsive-desktop.css?v=20260709-1">
</head>
<body class="glass-page auth-page">
    <main class="container auth-container">
        <nav class="top-bar page-navigation" aria-label="Навігація сайтом">
            <button class="back-home-btn" type="button" onclick="history.back()">Назад</button>
            <a class="brand-title site-brand" href="index.html" data-market-label>
                Одеса • Ринок Привоз
            </a>
            <span class="auth-nav-space" aria-hidden="true"></span>
        </nav>

        <form id="authForm" class="panel-section auth-card">
            <p class="home-kicker">Кабінет продавця</p>
            <h1>Вхід</h1>
            <p class="subtitle">Увійдіть або створіть обліковий запис продавця.</p>

            <input id="authEmail" type="email" placeholder="Електронна пошта" autocomplete="email" required>
            <input id="authPassword" type="password" placeholder="Пароль, щонайменше 6 символів" autocomplete="current-password" minlength="6" required>
            <input
                id="authPasswordConfirm"
                class="hidden"
                type="password"
                placeholder="Повторіть пароль для реєстрації"
                autocomplete="new-password"
                minlength="6"
            >

            <button id="loginBtn" class="btn-primary" type="submit">Увійти</button>
            <button id="registerBtn" class="btn-outline" type="button">Створити обліковий запис</button>
            <button id="forgotPasswordBtn" class="auth-link-btn" type="button">Забули пароль?</button>

            <div id="passwordResetPanel" class="auth-extra-panel hidden">
                <h2>Новий пароль</h2>
                <p class="field-note">Введіть новий пароль після переходу з листа відновлення.</p>
                <input
                    id="newPassword"
                    type="password"
                    placeholder="Новий пароль"
                    autocomplete="new-password"
                    minlength="6"
                >
                <input
                    id="newPasswordConfirm"
                    type="password"
                    placeholder="Повторіть новий пароль"
                    autocomplete="new-password"
                    minlength="6"
                >
                <button id="saveNewPasswordBtn" class="btn-primary" type="button">Зберегти новий пароль</button>
            </div>

            <p id="authMessage" class="form-message" aria-live="polite"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js?v=20260729-3"></script>
    <script src="js/i18n.js?v=20260731-1"></script>
    <script src="js/core.js?v=20260801-1"></script>
    <script>
        updateMarketLabels();
        initAuthPage();
    </script>
</body>
</html>
