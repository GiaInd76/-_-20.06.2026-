<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Вставте Cloudflare Turnstile Site Key у content; секрет зберігається тільки в Supabase Dashboard. -->
    <meta name="turnstile-site-key" content="">
    <title>Вхід продавця — Ринок Онлайн</title>

    <link rel="stylesheet" href="css/base.css?v=20260622-2">
    <link rel="stylesheet" href="css/home.css?v=20260622-2">
    <link rel="stylesheet" href="css/components.css?v=20260831-2">
    <link rel="stylesheet" href="css/seller.css?v=20260622-2">
    <link rel="stylesheet" href="css/glass-theme.css?v=20260622-2">
    <link rel="stylesheet" href="css/internal-pages.css?v=20260628-1">
    <link rel="stylesheet" href="css/overrides.css?v=20260801-1">
    <link rel="stylesheet" href="css/theme-background.css?v=20260729-1">
    <link rel="stylesheet" href="css/auth.css?v=20260831-2">
    <link rel="stylesheet" href="css/responsive-mobile.css?v=20260709-1">
    <link rel="stylesheet" href="css/responsive-desktop.css?v=20260709-1">
</head>
<body class="glass-page auth-page">
    <main class="container auth-container">
        <nav class="top-bar page-navigation" aria-label="Навігація сайтом">
            <button class="back-home-btn" type="button" onclick="history.back()">Назад</button>
            <a class="brand-title site-brand" href="index.html" data-market-label>
                Одеса • Ринок Привоз
            </a>
            <span class="auth-nav-space" aria-hidden="true"></span>
        </nav>

        <form id="authForm" class="panel-section auth-card" novalidate>
            <p class="home-kicker">Кабінет продавця</p>
            <h1 id="authTitle">Вхід</h1>
            <p class="subtitle">Увійдіть або створіть обліковий запис продавця.</p>

            <div class="auth-mode-tabs" role="tablist" aria-label="Вхід або реєстрація">
                <button id="loginModeBtn" class="auth-mode-tab is-active" type="button" role="tab" aria-selected="true">Увійти</button>
                <button id="registerModeBtn" class="auth-mode-tab" type="button" role="tab" aria-selected="false">Реєстрація</button>
            </div>

            <input id="authEmail" type="email" placeholder="Електронна пошта" autocomplete="email" maxlength="254" required>
            <input id="authPassword" type="password" placeholder="Пароль, щонайменше 8 символів" autocomplete="current-password" minlength="8" maxlength="128" required>
            <input
                id="authPasswordConfirm"
                class="hidden"
                type="password"
                placeholder="Повторіть пароль для реєстрації"
                autocomplete="new-password"
                minlength="8"
                maxlength="128"
            >

            <div id="captchaContainer" class="auth-captcha hidden" aria-live="polite"></div>

            <button id="authSubmitBtn" class="btn-primary" type="submit">Увійти</button>
            <button id="forgotPasswordBtn" class="auth-link-btn" type="button">Забули пароль?</button>

            <div id="passwordResetPanel" class="auth-extra-panel hidden">
                <h2>Новий пароль</h2>
                <p class="field-note">Введіть новий пароль після переходу з листа відновлення.</p>
                <input
                    id="newPassword"
                    type="password"
                    placeholder="Новий пароль"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                >
                <input
                    id="newPasswordConfirm"
                    type="password"
                    placeholder="Повторіть новий пароль"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                >
                <button id="saveNewPasswordBtn" class="btn-primary" type="button">Зберегти новий пароль</button>
            </div>

            <p id="authMessage" class="form-message" aria-live="polite"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
    <script src="js/url-security.js?v=20260831-1"></script>
    <script src="js/supabase-client.js?v=20260831-2"></script>
    <script src="js/i18n.js?v=20260831-2"></script>
    <script src="js/core.js?v=20260831-2"></script>
    <script>
        updateMarketLabels();
        initAuthPage();
    </script>
</body>
</html>
