<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход продавца — Ринок Онлайн</title>

    <link rel="stylesheet" href="css/base.css?v=20260622-2">
    <link rel="stylesheet" href="css/home.css?v=20260622-2">
    <link rel="stylesheet" href="css/components.css?v=20260702-1">
    <link rel="stylesheet" href="css/seller.css?v=20260622-2">
    <link rel="stylesheet" href="css/glass-theme.css?v=20260622-2">
    <link rel="stylesheet" href="css/internal-pages.css?v=20260628-1">
    <link rel="stylesheet" href="css/overrides.css?v=20260702-1">
    <link rel="stylesheet" href="css/auth.css?v=20260709-2">
    <link rel="stylesheet" href="css/responsive-mobile.css?v=20260709-1">
    <link rel="stylesheet" href="css/responsive-desktop.css?v=20260709-1">
</head>
<body class="glass-page auth-page">
    <main class="container auth-container">
        <nav class="top-bar page-navigation" aria-label="Навигация по сайту">
            <button class="back-home-btn" type="button" onclick="history.back()">Назад</button>
            <a class="brand-title site-brand" href="index.html">Ринок</a>
            <span class="auth-nav-space" aria-hidden="true"></span>
        </nav>

        <form id="authForm" class="panel-section auth-card">
            <p class="home-kicker">Кабинет продавца</p>
            <h1>Вход</h1>
            <p class="subtitle">Войдите или создайте аккаунт продавца.</p>

            <input id="authEmail" type="email" placeholder="Электронная почта" autocomplete="email" required>
            <input id="authPassword" type="password" placeholder="Пароль, минимум 6 символов" autocomplete="current-password" minlength="6" required>
            <input
                id="authPasswordConfirm"
                class="hidden"
                type="password"
                placeholder="Повторите пароль для регистрации"
                autocomplete="new-password"
                minlength="6"
            >

            <button id="loginBtn" class="btn-primary" type="submit">Войти</button>
            <button id="registerBtn" class="btn-outline" type="button">Создать аккаунт</button>
            <button id="forgotPasswordBtn" class="auth-link-btn" type="button">Забыли пароль?</button>

            <div id="passwordResetPanel" class="auth-extra-panel hidden">
                <h2>Новый пароль</h2>
                <p class="field-note">Введите новый пароль после перехода из письма восстановления.</p>
                <input
                    id="newPassword"
                    type="password"
                    placeholder="Новый пароль"
                    autocomplete="new-password"
                    minlength="6"
                >
                <input
                    id="newPasswordConfirm"
                    type="password"
                    placeholder="Повторите новый пароль"
                    autocomplete="new-password"
                    minlength="6"
                >
                <button id="saveNewPasswordBtn" class="btn-primary" type="button">Сохранить новый пароль</button>
            </div>

            <p id="authMessage" class="form-message" aria-live="polite"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js?v=20260709-2"></script>
    <script src="js/i18n.js?v=20260709-2"></script>
    <script>initAuthPage();</script>
</body>
</html>
