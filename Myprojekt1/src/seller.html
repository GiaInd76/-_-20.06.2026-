<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Продавець — Ринок Онлайн

    </title>


    <!-- Подключение CSS -->

    <link rel="stylesheet" href="css/base.css?v=20260723-1">
    <link rel="stylesheet" href="css/home.css?v=20260623-3">
    <link rel="stylesheet" href="css/components.css?v=20260901-1">
    <link rel="stylesheet" href="css/seller.css?v=20260622-1">
    <link rel="stylesheet" href="css/glass-theme.css?v=20260730-1">
    <link rel="stylesheet" href="css/internal-pages.css?v=20260628-1">
    <link rel="stylesheet" href="css/overrides.css?v=20260801-1">
    <link rel="stylesheet" href="css/theme-background.css?v=20260729-1">
    <link rel="stylesheet" href="css/responsive-mobile.css?v=20260709-1">
    <link rel="stylesheet" href="css/responsive-desktop.css?v=20260709-1">

</head>

<body class="glass-page seller-page">

    <div class="container">


        <!-- Общая навигация внутренних страниц -->

        <nav class="top-bar page-navigation" aria-label="Навігація сайтом">
            <button class="back-home-btn" type="button">
                Назад
            </button>

            <a class="brand-title site-brand" href="index.html" data-market-label>
                Одеса • Ринок Привоз
            </a>

            <button id="sellerEditNavBtn" class="seller-edit-nav-btn hidden" type="button">
                Редагувати точку
            </button>
        </nav>


        <!-- Дані продавця -->

        <div id="sellerPage"></div>


        <!-- Список товарів -->

        <section class="seller-menu">

            <h2 class="section-title">

                Товари

            </h2>

            <div
                id="sellerDepartments"
                class="seller-departments hidden"
                aria-label="Відділи торгової точки"
            ></div>


            <!-- JavaScript додасть товари -->

            <div
                class="product-list"
                id="sellerProducts"
            ></div>

        </section>


    </div>


    <!-- Редактирование товара владельцем лавки -->

    <div id="ownerProductModal" class="modal">
        <div class="modal-content owner-product-editor">
            <h2>Редагувати товар</h2>

            <input id="ownerProductName" type="text" placeholder="Назва товару">
            <input id="ownerProductDepartment" type="text" placeholder="Відділ">
            <input
                id="ownerProductPrice"
                type="text"
                inputmode="decimal"
                maxlength="24"
                placeholder="Ціна, наприклад 630 або 630/650"
            >

            <select id="ownerProductUnit">
                <option value="kg">кг</option>
                <option value="gram">г</option>
                <option value="liter">л</option>
                <option value="piece">шт</option>
                <option value="pack">упаковка</option>
            </select>

            <textarea id="ownerProductDescription" placeholder="Опис товару"></textarea>

            <button id="saveOwnerProductBtn" class="add-btn" type="button">
                Зберегти
            </button>

            <button id="cancelOwnerProductBtn" class="btn-outline" type="button">
                Скасувати
            </button>

            <p id="ownerProductMessage" class="form-message"></p>
        </div>
    </div>


    <!-- Модальное окно товара -->

    <div
        id="productModal"
        class="modal"
    >

        <div class="modal-content product-modal-content">

            <div
                id="productModalImage"
                class="product-modal-image"
            ></div>

            <h3 id="productModalTitle"></h3>

            <p
                id="productModalPrice"
                class="product-modal-price"
            ></p>

        </div>

    </div>


    <!-- Модальное окно -->

    <div
        id="modal"
        class="modal info-modal"
    >

        <div class="modal-content info-modal-content">

            <p id="findModalText">

                Інформація про місце поки не заповнена.

            </p>

        </div>

    </div>


    <!-- Контакти продавця -->

    <div
        id="contactModal"
        class="modal info-modal"
    >

        <div class="modal-content contact-modal-content">
            <p class="contact-modal-label">Телефон</p>

            <a id="sellerPhoneLink" class="seller-phone-link">
                Номер поки не вказано
            </a>

            <div class="contact-socials" aria-label="Посилання продавця">
                <a id="sellerTelegramLink" class="contact-icon contact-telegram" aria-label="Telegram">T</a>
                <a id="sellerInstagramLink" class="contact-icon contact-instagram" aria-label="Instagram">I</a>
                <a id="sellerViberLink" class="contact-icon contact-viber" aria-label="Viber">V</a>
            </div>

        </div>

    </div>


    <!-- QR-код публічної сторінки продавця -->

    <div
        id="sellerQrModal"
        class="modal info-modal qr-modal"
        aria-hidden="true"
    >
        <div
            class="modal-content info-modal-content qr-modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="sellerQrTitle"
        >
            <button
                id="sellerQrCloseBtn"
                class="qr-modal-close"
                type="button"
                aria-label="Закрити"
            >×</button>

            <h2 id="sellerQrTitle">QR-код сторінки</h2>
            <div id="sellerQrCode" class="seller-qr-code" aria-live="polite"></div>
            <p id="sellerQrHint" class="qr-modal-hint">Відскануйте, щоб відкрити сторінку продавця</p>
        </div>
    </div>


    <!-- Підключення JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
    <script src="js/url-security.js?v=20260831-1"></script>
    <script src="js/supabase-client.js?v=20260831-3"></script>
    <script src="js/i18n.js?v=20260901-1"></script>
    <script src="js/core.js?v=20260831-2"></script>
    <script src="js/catalog.js?v=20260901-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="js/product-modal.js?v=20260901-1"></script>
    <script src="js/app.js?v=20260831-1"></script>

</body>

</html>
